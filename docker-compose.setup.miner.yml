version: '3.1'

services:
  miner-daemon:
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      LOTUS_API_LISTENADDRESS: /ip4/172.16.11.2/tcp/1234/http
      LOTUS_API_REMOTELISTENADDRESS: /ip4/172.16.100.22/tcp/11337
      LOTUS_LIBP2P_LISTENADDRESSES: '/ip4/0.0.0.0/tcp/11337'
      LOTUS_LIBP2P_ANNOUNCEADDRESSES: '/ip4/172.16.100.22/tcp/11337'
      LOTUS_PATH: /data/daemon
    command: sh -c "/lotus-binaries/lotus daemon --genesis=/data/devgen.car"
    healthcheck:
      test: [ "CMD", "/lotus-binaries/lotus", "sync", "status" ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      miner:
        ipv4_address: 172.16.11.2
      external:
        ipv4_address: 172.16.100.22

  miner-miner:
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    depends_on:
      miner-daemon:
        condition: service_healthy
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      LOTUS_API_LISTENADDRESS: /ip4/172.16.11.3/tcp/2345/http
      FULLNODE_API_INFO: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJBbGxvdyI6WyJyZWFkIiwid3JpdGUiLCJzaWduIiwiYWRtaW4iXX0.nbtgBBkdl2YmRLVuK_QEAUMSpPwUXilWOHLKVlUooFc:/ip4/172.16.11.2/tcp/1234
      LOTUS_MINER_PATH: /data/miner
    command: sh -c "/lotus-binaries/lotus-miner init --owner=t3so25q3fj7pcjcro3jdk5qdnxqfvvqsdrr2bseuxncjf4biyapcua57ri7mxxpcpmepfd2idyljsde5w2ppgq --worker=t3va6jw5sdnrlzy4tk6xvbko2boyl2tn5ucx7yytiznm3wp5yxsgsssuemm7ksqt473vhxtm2eietbmfgq5lga --no-local-storage --sector-size 2k"
    networks:
      miner:
        ipv4_address: 172.16.11.3

networks:
  miner:
    ipam:
      driver: default
      config:
        - subnet: "172.16.11.0/24"
  external:
    ipam:
      driver: default
      config:
        - subnet: "172.16.100.0/24"