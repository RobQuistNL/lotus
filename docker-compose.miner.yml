version: '3.1'

services:
  miner-daemon:
    hostname: miner1-daemon
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      LOTUS_API_LISTENADDRESS: /ip4/172.16.11.2/tcp/1234/http
      LOTUS_API_REMOTELISTENADDRESS: /ip4/172.16.100.22/tcp/11337
      LOTUS_LIBP2P_LISTENADDRESSES: '/ip4/0.0.0.0/tcp/11337'
      LOTUS_LIBP2P_ANNOUNCEADDRESSES: '/ip4/172.16.100.22/tcp/11337'
      LOTUS_PATH: /data/daemon
    command: sh -c "/lotus-binaries/lotus daemon --genesis=/data/devgen.car"
    healthcheck:
      test: [ "CMD", "/lotus-binaries/lotus", "sync", "status" ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      miner:
        ipv4_address: 172.16.11.2
      external:
        ipv4_address: 172.16.100.22

  miner-miner:
    hostname: miner1-miner
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    depends_on:
      miner-daemon:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/lotus-binaries/lotus-miner", "info" ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      LOTUS_API_LISTENADDRESS: /ip4/172.16.11.3/tcp/2345/http
      WORKER_OVERRIDE_ID: main
      FULLNODE_API_INFO: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJBbGxvdyI6WyJyZWFkIiwid3JpdGUiLCJzaWduIiwiYWRtaW4iXX0.mIkPsEXycoD56YDrovARS7cTgIEgf6tgqAD8KcCRfn0:/ip4/172.16.11.2/tcp/1234
      LOTUS_MINER_PATH: /data/miner
      LOTUS_SEALING_BATCHPRECOMMITS: false
      LOTUS_SEALING_AGGREGATECOMMITS: false
    command: sh -c "/lotus-binaries/lotus net connect /ip4/172.16.100.12/tcp/11337/p2p/12D3KooWMJRZoLazg7PQrEjnCqQ35EXwu6AVJg4uuFG1vnMWPWDr; /lotus-binaries/lotus-miner run"
    networks:
      miner:
        ipv4_address: 172.16.11.3

  miner-pc1worker1:
    hostname: miner1-pc1worker_1
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    depends_on:
      miner-miner:
        condition: service_healthy
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      WORKER_OVERRIDE_ID: main
      MINER_API_INFO: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJBbGxvdyI6WyJyZWFkIiwid3JpdGUiLCJzaWduIiwiYWRtaW4iXX0.0upNCQa_azo05CV6ANVFX-e2oYLBErzD3-NKuLJgCgI:/ip4/172.16.11.3/tcp/2345
      LOTUS_WORKER_PATH: /data/pc1worker_1
      GOLOG_LOG_FMT: color
      RUST_LOG: info
      RUST_BACKTRACE: full
    command: sh -c "/lotus-binaries/lotus-worker run --listen 172.16.11.4:4001 --addpiece=true --precommit1=true --precommit2=false --commit=false --unseal=true --replica-update=false --prove-replica-update2=false --regen-sector-key=false  --no-local-storage=true --finalize=true"
    networks:
      miner:
        ipv4_address: 172.16.11.4

  miner-pc2worker1:
    hostname: miner1-pc2worker_1
    image: genesis-daemon
    build: ./tools/dockers/devnet/genesis-daemon
    depends_on:
      miner-miner:
        condition: service_healthy
    volumes:
      - '/var/tmp/filecoin-proof-parameters:/var/tmp/filecoin-proof-parameters'
      - '/home/aorus/lotus-network/miner:/data'
      - '/home/aorus/lotus:/lotus-binaries'
    environment:
      WORKER_OVERRIDE_ID: main
      MINER_API_INFO: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJBbGxvdyI6WyJyZWFkIiwid3JpdGUiLCJzaWduIiwiYWRtaW4iXX0.0upNCQa_azo05CV6ANVFX-e2oYLBErzD3-NKuLJgCgI:/ip4/172.16.11.3/tcp/2345
      LOTUS_WORKER_PATH: /data/pc2worker_1
    command: sh -c "/lotus-binaries/lotus-worker run --listen 172.16.11.5:4002 --addpiece=false --precommit1=false --precommit2=true --commit=false --unseal=false --parallel-fetch-limit=1 --replica-update=true --prove-replica-update2=true --regen-sector-key=true --no-swap=true --no-local-storage=true"
    networks:
      miner:
        ipv4_address: 172.16.11.5


networks:
  miner:
    ipam:
      driver: default
      config:
        - subnet: "172.16.11.0/24"
  external:
    ipam:
      driver: default
      config:
        - subnet: "172.16.100.0/24"